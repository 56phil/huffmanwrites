name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  schedule:
    # 05:00 UTC = midnight Central Time (CDT). Publishes future-dated posts
    # (e.g. the 9/11 anniversary essay) at the stroke of their date.
    - cron: '0 5 * * *'
    # 11:00 UTC = 06:00 Central Time (CDT). Publishes the Saturday digest at 6 AM.
    - cron: '0 11 * * *'
    # 12:00 UTC = 07:00 Central Time (CDT). Publishes a post embargoed to 07:00 CT
    # (the Weekly Satire, whose launchd job fires the same minute) at the stroke
    # of its date. Without this fire a post dated 07:00 is still future at the
    # 06:00 build and waits for the next push — the "date ahead of the clock"
    # failure wearing different clothes.
    - cron: '0 12 * * *'
    # 13:00 UTC = 07:00 Central Time (CST). The same 07:00 CT slot, after the DST
    # change on 2026-11-01: 12:00Z is then 06:00 CT, an hour early, so the 12:00Z
    # fire alone would skip a post dated 07:00 CST. Both fires are harmless in
    # the other season (the wrong-season fire finds the page already built or
    # still an hour off and does nothing); this pair, with 05:00Z and 11:00Z,
    # covers 00:00, 06:00 and 07:00 CT in both CDT and CST. Add a fire only for a
    # genuinely new hour, and change this comment with it.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: npm install -g sass

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Node.js dependencies
        run: |
          [[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true

      # Fail the build before deploy if the gallery pagination contract is
      # broken. The layout derives its page count from data/gallery.yml while
      # the page stubs are hand-written, so adding a gallery item past a page
      # boundary links to a page that was never generated (a live 404 — see
      # the 2026-09-18 page 9 incident). Checking here keeps it off production.
      - name: Check gallery pagination
        run: python3 scripts/check-gallery-pages.py

      # Fail before deploy if an epigraph lacks a checkable source. The site has
      # pre-rule quotations listed in scripts/quote-baseline.txt; those pass, and
      # editing one withdraws its exemption (the baseline is keyed by the quoted
      # text). No network here — wording verification is the --online flag, run
      # deliberately, not on every push.
      - name: Check quotation citations
        run: python3 scripts/check-quotes.py

      # Fail before deploy if a citation is fabricated. Deterministic and
      # offline: it catches placeholder URLs ([ID], TODO, example.com) and any
      # URL recorded in scripts/check-links-blocklist.txt as proven to resolve
      # to the wrong article. Full network verification is
      # `scripts/check-links.py --online`, run deliberately before publishing —
      # never here, where a 403 from a bot-blocking host would fail the build
      # for no reason.
      - name: Check citation integrity
        run: python3 scripts/check-links.py --check

      # Fail before deploy if a file's em-dash count grows. The limit is 3 in
      # body prose; dashes inside quotations and in date/number ranges are
      # exempt (CLAUDE.md). Content written before the exemption amendment is
      # recorded in scripts/emdash-baseline.txt, keyed by file with its count at
      # that moment — so the ratchet is on the number, not on presence: a file
      # may be reduced freely but may not grow. Editing a file to add prose
      # dashes fails here; reducing them passes.
      - name: Check em-dash limit
        run: python3 scripts/check-emdashes.py --check

      # Fail before deploy if a file's stranded-preposition count grows. Same
      # ratchet shape as the em-dash gate above: the baseline is a low-water
      # mark, reducing is free, growing fails. Measured 2026-10-08, this workflow
      # ran the em-dash ratchet and NOT this one — the preposition rule was
      # enforced per-file in the publishing tail from 2026-09-25 and across the
      # corpus by nothing, so hand-written posts could add sentence-final
      # prepositions freely. A rule with no enforcement point is a rule that
      # holds only where someone remembered it.
      - name: Check stranded prepositions
        run: python3 scripts/check-prepositions.py --check

      # Fail before deploy if a hero path names no file. Hugo does not fail on a
      # missing image — the build succeeds, the page returns 200, and the hero
      # renders as an empty box. check-render-integrity below catches it too,
      # but only after a full build; this one is cheap enough for every run and
      # is what the report runners use, since they never build public/.
      - name: Check hero paths
        run: python3 scripts/check-hero-paths.py

      # Fail before deploy if a published installment of a recurring series is
      # missing `featuredOnHome: true`. The home page takes its five Recent Posts
      # from flagged posts only, and more than five carry the flag, so an
      # unflagged installment publishes and reaches no reader from the home page.
      # Nothing else can see it: the build passes, the page returns 200, and the
      # RSS feed lists it — it is simply absent from the one place a reader
      # lands. Five Senate race reports shipped this way between Sept 6 and
      # Sept 27, 2026, because the skill's frontmatter list omitted the field.
      # The series are derived from data/gallery.yml's `latest` globs, so a new
      # series is covered when its card is added and this list cannot drift.
      - name: Check series posts reach the home page
        run: python3 scripts/check-series-posts.py

      # Fail before deploy if a published series installment is not publishable.
      # Every rule encodes a shipped failure, and `draft: true` is the one that
      # matters: the site would build clean, return 200, and simply not carry the
      # page — while every other gate reported OK. The runners check the file
      # they just wrote (--file); this covers the corpus, so a report edited
      # after it published cannot silently drop out of the deploy.
      - name: Check report frontmatter
        run: python3 scripts/check-report-frontmatter.py --corpus

      # Fail before deploy if a frontmatter field a layout depends on is absent.
      # Hugo does not fail on a missing field — it renders a blank spot or falls
      # back to an unintended default — so a post with no `lastmod`, a summary
      # with no `sort_key`, or a book page missing a hero field ships green. The
      # summary hub is ordered by `sort_key` (`ByParam`), so a summary without
      # the key is not rejected; it sorts by zero-value and lands wherever
      # Hugo's fallback puts it. The gate prints how many files it inspected
      # (`coverage: N files`), which is the number to trust rather than any
      # count written here.
      - name: Check content frontmatter
        run: python3 scripts/check-content-frontmatter.py

      # Fail before deploy if ANY published post links with a placeholder anchor.
      # A `[text]` link is a reader-facing defect wherever it appears, and it
      # blinds `check-links.py --titles` on that citation wherever it appears —
      # the check for a URL that returns 200 and serves an unrelated article.
      # The report series is covered above; this covers every other published
      # post, which nothing else was watching. Measured before this was added:
      # 36 published files used a placeholder anchor. The gate prints the
      # population it scanned (`coverage: N posts`); trust that line, not this
      # comment.
      - name: Check link anchors name what they link to
        run: python3 scripts/check-report-frontmatter.py --anchors-corpus

      # Fail before deploy if a credential has drifted between its homes. This
      # gate exists because the fal.ai key lived in three places and only one
      # worked, and nothing could see it: a stale key has the right length, the
      # right prefix and the right home, and is wrong only in a way you learn by
      # spending it. Offline and deterministic here — it compares the keychain
      # (absent in CI) with ~/.secrets (also absent), so it no-ops, which is the
      # correct behavior on a machine that holds no secrets. The liveness probe
      # is `--online`, run by the weekly integrity job, not on every push.
      - name: Check credential drift
        run: python3 scripts/check-secrets.py

      # Fail if a scheduled job's plist cannot be loaded. The weekly integrity
      # check shipped with "--" inside an XML comment, which is illegal, so
      # launchd refused the file and the job never ran — silently, for days,
      # because bootstrap does not report it. A scheduled guard that never runs
      # is worse than no guard: the intent feels satisfied. This also catches a
      # missing schedule key and a reference to a script that does not exist.
      - name: Check launchd schedules
        run: python3 scripts/check-plists.py

      # The gates above are load-bearing, and four of them have been wrong in
      # ways found only by accident: a counting-semantics mismatch in the
      # em-dash gate, a blind spot in the quotation gate that made a *better*
      # citation invisible to it, and a hero-image srcset bug in the render
      # check. This suite tests the RULES those gates enforce — the exemption
      # logic, the fabrication patterns this corpus has produced, and the blind
      # spots that were actually fixed — so a regression fails here instead of
      # shipping. It also syntax-checks every runner with `bash -n`, which is
      # the only lint this repo has.
      - name: Run gate tests
        run: python3 scripts/test_gates.py

      - name: Build with Hugo
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}"

      # Runs AFTER the build because it inspects the rendered output. Catches a
      # class nothing else can: a page that builds cleanly, returns 200, and is
      # still broken — a URL attribute Go's safety filter rejected (rendering
      # the ZgotmplZ sentinel) or a local reference to a file that does not
      # exist. Every mobile hero on /books/stoic-backgammon/ was broken this way
      # for weeks: the hero files have a space in their names and Hugo
      # percent-encodes spaces in `src` but not in `srcset`.
      - name: Check render integrity
        run: python3 scripts/check-render-integrity.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5